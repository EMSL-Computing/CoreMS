include:
  - remote: 'https://raw.githubusercontent.com/pnnl-miscscripts/gitlab-lib/v1/gitlab-lib.yaml'

# ---------------------------------------------------------------------------
# Global configuration
# ---------------------------------------------------------------------------
default:
  image: python:3.13-slim
  tags:
    - k8s
    - rzr
    - codebuilds

services:
  - postgres:18

variables:
  POSTGRES_DB: molformula
  POSTGRES_USER: coremsdb
  POSTGRES_PASSWORD: coremsmolform
  POSTGRES_HOST_AUTH_METHOD: trust
  COREMS_DATABASE_URL: postgresql://coremsdb:coremsmolform@postgres:5432/molformula
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_ROOT_USER_ACTION: ignore
  # Avoids libicu dependency crash when .NET initialises in a slim container
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

stages:
  - test
  - test-notebooks
  - build
  - publish
  - publish-image

# ---------------------------------------------------------------------------
# Helpers
# ---------------------------------------------------------------------------
.install-dotnet: &install-dotnet
  - apt-get update -qq && apt-get install -y --no-install-recommends
      curl ca-certificates libssl3 libkrb5-3 zlib1g gcc python3-dev
  - curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
  - chmod +x /tmp/dotnet-install.sh
  - /tmp/dotnet-install.sh --runtime dotnet --channel 8.0 --install-dir /usr/local/dotnet
  - export DOTNET_ROOT=/usr/local/dotnet
  - export PATH="$PATH:/usr/local/dotnet"
  - rm /tmp/dotnet-install.sh

.install-deps: &install-deps
  - *install-dotnet
  - python3 -V
  - python3 -m pip install --upgrade pip
  - python3 -m pip install -e ".[dev]"
  - export PYTHONNET_RUNTIME=coreclr

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test-source:
  stage: test
  script:
    - *install-deps
    - mkdir -p doc/coverage_html_report
    - pytest --cache-clear -p no:warnings -q --cov=corems --cov-report=html:doc/coverage_html_report --cov-report=term

  artifacts:
    when: always
    paths:
      - doc/coverage_html_report
    expire_in: 7 days

# ---------------------------------------------------------------------------
# Notebook tests
# ---------------------------------------------------------------------------
test-notebooks:
  stage: test-notebooks
  script:
    - *install-deps
    - python3 -m pip install --no-cache-dir jupyter nbconvert
    - cd examples && python3 test_notebooks.py

  artifacts:
    when: on_failure
    paths:
      - /tmp/*_test.ipynb
    expire_in: 3 days

# ---------------------------------------------------------------------------
# Build sdist + wheel
# ---------------------------------------------------------------------------
build-package:
  stage: build
  script:
    - python3 -m pip install --upgrade pip build
    - python3 -m build

  artifacts:
    paths:
      - dist/
    expire_in: 7 days

# ---------------------------------------------------------------------------
# Publish to PyPI  (version tags on the default branch only, e.g. v3.11.0)
# ---------------------------------------------------------------------------
publish-pypi:
  stage: publish
  needs: [build-package]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - python3 -m pip install --upgrade twine
    - twine upload dist/*
  environment:
    name: pypi
    url: https://pypi.org/project/CoreMS/

# ---------------------------------------------------------------------------
# Build and push the base container image to the GitLab registry
# (runs only on the default branch or version tags)
# ---------------------------------------------------------------------------
publish-image:
  extends: .pnnllib-gitlab-build-container-image
  stage: publish-image
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  variables:
    KANIKO_EXTRA_ARGS: "--cache=true --cache-copy-layers=true --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --destination $CI_REGISTRY_IMAGE:latest"
    CONTEXT: $CI_PROJECT_DIR
    DOCKERFILE: Dockerfile_py310_dotnet_base_clean
    KUBERNETES_CPU_REQUEST: 100m
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: 2Gi
    KUBERNETES_MEMORY_LIMIT: 8Gi
