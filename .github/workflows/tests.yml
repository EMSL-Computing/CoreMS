name: Test

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - '**/*.md'

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Source tests
            make_target: ci-test-source
            lipidomics_sqlite_path: tests/tests_data/lcms/202412_lipid_ref.sqlite
          - name: Notebook tests
            make_target: ci-test-notebooks
            lipidomics_sqlite_path: ''
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: molformula
          POSTGRES_USER: coremsdb
          POSTGRES_PASSWORD: coremsmolform
        options: >-
          --health-cmd "pg_isready -U coremsdb -d molformula"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      COREMS_DATABASE_URL: postgresql://coremsdb:coremsmolform@localhost:5432/molformula
      LIPIDOMICS_SQLITE_PATH: ${{ matrix.lipidomics_sqlite_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Run tests
        run: make ${{ matrix.make_target }}
